<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Страницы живут по адресам /catalog, /catalog/berserk… — все пути считаем от корня сайта -->
  <base href="/">
  <title>Aniverse Flip — стерео-карточки по аниме</title>
  <meta name="description" content="Стерео-карточки с любимыми персонажами аниме — или с тобой и твоими друзьями. Наклони — и картинка оживает.">
  <link rel="preload" as="image" href="assets/cards/guts-special-a.jpg" fetchpriority="high">
<!--#include head-->
</head>
<body data-page="index">

<!--#include header-->

<main id="top">
  <!-- HERO: витрина карточек на подиумах — листается пальцем или мышью -->
  <section class="hero" aria-labelledby="heroTitle">
    <div class="wrap">
      <h1 class="hero__title" id="heroTitle"><span>Коллекционные карточки</span></h1>
      <!-- Огромное контурное название текущей серии за карточками, как на аниме-постере -->
      <div class="hero__mark" id="cfMark" aria-hidden="true"></div>
      <div class="cf" id="cf">
        <div class="cf__track" id="cfTrack" tabindex="0" aria-roledescription="карусель" aria-label="Коллекции: листай влево и вправо"></div>
      </div>
      <div class="cf__dots" id="cfDots" aria-hidden="true"></div>
      <div class="unis-wrap">
        <div class="unis" id="uniStrip" role="tablist" aria-label="Коллекции"></div>
        <button type="button" class="unis__next" id="uniNext" aria-label="Ещё коллекции"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <!-- Своя карточка: по фото или любой персонаж — ведёт в конструктор -->
      <a href="builder?preset=photo" class="btn hero__custom"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg>Создать свою индивидуальную карточку</a>
    </div>
  </section>

  <!-- НОВИНКИ -->
  <section class="section" id="new">
    <div class="wrap">
      <div class="sechead"><h2 class="h2">Новинки</h2><a href="catalog" class="sechead__more">Весь каталог</a></div>
      <div class="newcards" id="newCards"></div>
    </div>
  </section>

  <!-- ОТЗЫВЫ: три последних, остальные — на странице /reviews -->
  <section class="section" id="homeReviews">
    <div class="wrap">
      <div class="sechead"><h2 class="h2">Отзывы</h2><a href="reviews" class="sechead__more">Все отзывы</a></div>
      <div class="rv-sum" id="rvSum" hidden></div>
      <div class="rv-list rv-list--home" id="rvList"></div>
      <a href="reviews#rvForm" class="btn btn--ghost rv-cta">Оставить отзыв</a>
    </div>
  </section>

  <!-- АКЦИИ -->
  <section class="section" id="promo" hidden>
    <div class="wrap">
      <h2 class="h2">Акции</h2>
      <div class="promos" id="promos"></div>
    </div>
  </section>

</main>

<!--#include footer-->

<!--#include overlays-->
<!--#include scripts-->
</body>
</html>
